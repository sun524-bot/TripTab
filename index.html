<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripTab</title>
    <!-- Load theme.js first -->
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Core JS -->
    <script src="js/firebase-config.js?v=2"></script>
    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--coral) 0%, var(--gold) 100%);
        }
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner-container">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="20" height="14" rx="3" fill="white" fill-opacity="0.9"/>
            <rect x="2" y="6" width="20" height="6" rx="3" fill="white" fill-opacity="0.4"/>
            <path d="M12 4L14.5 8.5H9.5L12 4Z" fill="white" fill-opacity="0.9"/>
            <circle cx="7" cy="15" r="1.5" fill="rgba(255,107,107,0.6)"/>
        </svg>
        <div class="spinner"></div>
    </div>
    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.replace("dashboard.html");
            } else {
                window.location.replace("login.html");
            }
        });
    </script>
</body>
</html>
