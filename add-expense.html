<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TripTab - Add Expense</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TripTab">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF6B6B'/><text x='50' y='65' font-size='50' text-anchor='middle'>✈️</text></svg>">
  <script src="js/theme.js"></script>
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css?v=2">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  
  <script src="js/firebase-config.js?v=2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/trips.js?v=4"></script>
  <script src="js/expenses.js"></script>
  <style>
    .amount-hero {
      background: var(--gradient);
      color: white;
      padding: 3rem 1rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .amount-currency { font-size: 1.5rem; font-weight: bold; opacity: 0.9; }
    .amount-input-display {
      background: transparent;
      border: none;
      color: white;
      font-size: 3rem;
      font-weight: bold;
      width: 150px;
      text-align: left;
    }
    .amount-input-display:focus { outline: none; }
    .amount-input-display::placeholder { color: rgba(255,255,255,0.6); }
    

    .category-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .category-chip.active {
      background: var(--coral-light, #ffeaea);
      border-color: var(--coral);
      color: var(--coral);
    }
    .paidby-select {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .paidby-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .paidby-chip.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }
    .split-selector {
      display: flex;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.25rem;
      margin-bottom: 1rem;
    }
    .split-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      text-align: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .split-btn.active {
      background: var(--bg-card);
      color: var(--coral);
      font-weight: 700;
      border-color: var(--coral);
      box-shadow: 0 2px 8px rgba(255,107,107,0.25);
    }
    .receipt-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 0.75rem;
    }
    .receipt-thumb {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 12px;
      overflow: visible;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      cursor: pointer;
      flex-shrink: 0;
    }
    .receipt-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 11px;
    }
    .receipt-empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      color: var(--text-3);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="add-expense-page">
    <div class="photo-preview-overlay hidden" id="photo-preview-modal" onclick="if (event.target.id === 'photo-preview-modal' || event.target.classList.contains('photo-preview-content')) closePhotoPreview();">
      <div class="photo-preview-content">
        <button class="photo-preview-close" onclick="closePhotoPreview()" type="button" aria-label="Close preview">✕</button>
        <img id="photo-preview-image" src="" alt="Receipt preview">
      </div>
    </div>
    <header class="app-bar">
      <button class="icon-btn" onclick="goBack()" type="button" aria-label="Back">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <span class="app-bar-title" id="page-title" data-i18n="addExpense">Add Expense</span>
      <button onclick="handleHeaderLangToggle()" class="btn-icon" style="font-weight:700;font-size:0.8rem;padding:4px 8px;border-radius:12px;border:1px solid var(--border);" aria-label="Language Toggle">
        <span class="lang-btn-label">中文</span>
      </button>
      <button class="icon-btn hidden text-danger" id="delete-btn" onclick="deleteExpense()" type="button" aria-label="Delete">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
      </button>
    </header>

    <form class="add-expense-form" id="expense-form">
      <!-- Amount Hero -->
      <div class="amount-hero">
        <div class="amount-currency">MYR</div>
        <input type="number" class="amount-input-display" id="amount-input" placeholder="0.00" min="0" step="0.01" required/>
      </div>

      <!-- Title & Date -->
      <div class="section-box container mt-4">
        <div class="form-group">
          <label class="form-label" data-i18n="expenseTitle">Title</label>
          <input type="text" class="form-input" id="title-input" data-i18n-placeholder="expenseTitle" required/>
        </div>
        <div class="form-group mt-4">
          <label class="form-label" data-i18n="date">Date</label>
          <input type="date" class="form-input" id="date-input" required/>
        </div>
      </div>

      <!-- Category -->
      <div class="section-box container">
        <div class="section-box-title" data-i18n="category">CATEGORY</div>
        <div class="category-grid" id="category-grid">
          <!-- rendered by JS -->
        </div>
      </div>

      <!-- Paid By -->
      <div class="section-box container">
        <div class="section-box-title" data-i18n="paidBy">PAID BY</div>
        <div class="paidby-select" id="paidby-select">
          <!-- member chips rendered by JS -->
        </div>
      </div>

      <!-- Split -->
      <div class="section-box container">
        <div class="section-box-title" data-i18n="splitWith">SPLIT WITH</div>
        <div class="split-selector">
          <button type="button" class="split-btn active" data-split="equal" data-i18n="equalSplit">Equal Split</button>
          <button type="button" class="split-btn" data-split="custom" data-i18n="customSplit">Custom Amount</button>
          <button type="button" class="split-btn" data-split="selective" data-i18n="selectiveSplit">Select People</button>
        </div>
        <div class="split-custom-list" id="split-details">
          <!-- rendered based on split type -->
        </div>
      </div>

      <!-- Notes -->
      <div class="section-box container">
        <div class="form-group">
          <label class="form-label" data-i18n="notes">Notes</label>
          <textarea class="form-textarea" id="notes-input" rows="2" placeholder="Optional notes..."></textarea>
        </div>
      </div>

      <!-- Receipts / Photos -->
      <div class="section-box container">
        <div class="section-box-title" data-i18n="receiptsPhotos">RECEIPTS / PHOTOS</div>
        <input type="file" id="receipt-input" accept="image/*" multiple hidden>
        <button type="button" class="btn btn-secondary btn-full" id="add-receipt-btn" data-i18n="addPhotos">Add Photos</button>
        <div class="receipt-gallery" id="receipt-gallery"></div>
      </div>

      <!-- Save button -->
      <div class="container pb-6">
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="save-btn" data-i18n="saveExpense">Save Expense</button>
      </div>
    </form>
  </div>

  <script>
    const tripId = getParam('tripId');
    const expenseId = getParam('expenseId');
    let currentUser = null;
    let tripData = null;
    let members = [];
    let selectedCategory = 'food';
    let selectedPayer = null;
    let splitType = 'equal';
    let selectedReceiptFiles = [];
    let existingReceiptUrls = [];
    let loadedExpenseSplits = null;
    let equalRoundMode = 'exact';
    
    const categories = [
      { id: 'food', icon: '🍔', key: 'catFood' },
      { id: 'transport', icon: '🚗', key: 'catTransport' },
      { id: 'hotel', icon: '🏨', key: 'catAccommodation' },
      { id: 'tickets', icon: '🎟️', key: 'catActivity' },
      { id: 'shopping', icon: '🛍️', key: 'catShopping' },
      { id: 'other', icon: '📦', key: 'catOther' }
    ];

    function updateSaveButtonLabel() {
      const btn = document.getElementById('save-btn');
      if (!btn) return;
      const key = expenseId ? 'saveEditExpense' : 'saveExpense';
      btn.setAttribute('data-i18n', key);
      btn.textContent = i18n.t(key);
    }

    function handleHeaderLangToggle() {
      i18n.toggle();
      setupCategoryGrid();
      renderSplitDetails();
      const titleEl = document.getElementById('page-title');
      if (titleEl && titleEl.getAttribute('data-i18n')) {
        titleEl.textContent = i18n.t(titleEl.getAttribute('data-i18n'));
      }
      updateSaveButtonLabel();
    }

    if (!tripId) window.location.href = 'dashboard.html';

    document.addEventListener('DOMContentLoaded', () => {
      // Set today's date
      document.getElementById('date-input').valueAsDate = new Date();
      
      requireAuth(user => {
        currentUser = user;
        selectedPayer = user.uid;
        loadForm();
      });
      i18n.init();
      updateSaveButtonLabel();
      
      setupCategoryGrid();
      
      document.querySelectorAll('.split-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.split-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          splitType = e.target.dataset.split;
          renderSplitDetails();
        });
      });
      
      document.getElementById('expense-form').addEventListener('submit', handleSave);
      document.getElementById('amount-input').addEventListener('input', renderSplitDetails);
      document.getElementById('add-receipt-btn').addEventListener('click', () => document.getElementById('receipt-input').click());
      document.getElementById('receipt-input').addEventListener('change', handleReceiptSelection);
    });

    function setupCategoryGrid() {
      const grid = document.getElementById('category-grid');
      if (!grid) return;
      grid.innerHTML = '';
      categories.forEach(cat => {
        const chip = document.createElement('div');
        chip.className = `category-chip ${cat.id === selectedCategory ? 'active' : ''}`;
        chip.innerHTML = `<div style="font-size:1.5rem">${cat.icon}</div><div style="font-size:0.75rem">${i18n.t(cat.key)}</div>`;
        chip.onclick = () => {
          document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          selectedCategory = cat.id;
        };
        grid.appendChild(chip);
      });
    }

    async function loadForm() {
      try {
        // Load trip to get members
        const tripDoc = await db.collection('trips').doc(tripId).get({ source: 'cache' }).catch(() => {
          return db.collection('trips').doc(tripId).get();
        });
        if (!tripDoc.exists) return goBack();
        tripData = tripDoc.data();
        
        const memberMap = tripData.members || {};
        members = Object.entries(memberMap).map(([id, m]) => {
          const mData = m || {};
          return {
            id,
            displayName: mData.name || mData.displayName || (mData.email ? mData.email.split('@')[0] : 'Member'),
            email: mData.email || ''
          };
        });
        
        renderPayerSelect();
        renderSplitDetails();
        
        if (expenseId) {
          const titleEl = document.getElementById('page-title');
          titleEl.setAttribute('data-i18n', 'editExpense');
          titleEl.textContent = i18n.t('editExpense');
          updateSaveButtonLabel();
          document.getElementById('delete-btn').classList.remove('hidden');
          
          const expDoc = await db.collection('trips').doc(tripId).collection('expenses').doc(expenseId).get();
          if (expDoc.exists) {
            const exp = expDoc.data();
            loadedExpenseSplits = exp.splits || null;
            document.getElementById('amount-input').value = exp.amount;
            document.getElementById('title-input').value = exp.title;
            document.getElementById('date-input').value = exp.date;
            document.getElementById('notes-input').value = exp.notes || '';
            
            selectedCategory = exp.category || 'other';
            setupCategoryGrid();
            
            selectedPayer = exp.paidBy;
            existingReceiptUrls = Array.isArray(exp.photoUrls) ? exp.photoUrls : [];
            
            // Auto-detect splitType if splits exist
            if (loadedExpenseSplits) {
              equalRoundMode = exp.equalRoundMode || 'exact';
              const uids = Object.keys(loadedExpenseSplits);
              const values = Object.values(loadedExpenseSplits).map(Number);
              const uniqueValues = new Set(values);
              
              if (uids.length < members.length) {
                splitType = 'selective';
              } else if (uniqueValues.size > 1) {
                splitType = 'custom';
              } else {
                splitType = 'equal';
              }
              
              // Update split tabs active state
              document.querySelectorAll('.split-btn').forEach(btn => {
                if (btn.dataset.split === splitType) {
                  btn.classList.add('active');
                } else {
                  btn.classList.remove('active');
                }
              });
            }
            
            renderReceiptGallery();
            renderPayerSelect();
            renderSplitDetails(); 
          }
        }
      } catch (err) {
        console.warn('[Offline Mode] Error loading expense form:', err);
      }
    }

    function handleReceiptSelection(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      selectedReceiptFiles = selectedReceiptFiles.concat(files);
      renderReceiptGallery();
      event.target.value = '';
    }

    function removeExistingReceipt(index) {
      existingReceiptUrls.splice(index, 1);
      renderReceiptGallery();
    }

    function removeSelectedReceipt(index) {
      selectedReceiptFiles.splice(index, 1);
      renderReceiptGallery();
    }

    function renderReceiptGallery() {
      const gallery = document.getElementById('receipt-gallery');
      if (!gallery) return;

      gallery.innerHTML = '';

      if (!existingReceiptUrls.length && !selectedReceiptFiles.length) {
        const noText = (typeof i18n !== 'undefined' && i18n.t('noPhotosYet')) ? i18n.t('noPhotosYet') : 'No photos attached yet';
        gallery.innerHTML = `<div class="receipt-empty" style="color:var(--text-3); font-size:0.85rem; padding:0.5rem 0; width:100%;">${escapeHtml(noText)}</div>`;
        return;
      }

      existingReceiptUrls.forEach((rawUrl, idx) => {
        const src = typeof formatPhotoUrl === 'function' ? formatPhotoUrl(rawUrl) : rawUrl;
        const card = document.createElement('div');
        card.className = 'receipt-thumb';
        card.innerHTML = `
          <img src="${src}" alt="Receipt preview" style="width:100%; height:100%; object-fit:cover; border-radius:11px; cursor:pointer;">
          <button type="button" onclick="event.stopPropagation(); removeExistingReceipt(${idx});" style="position:absolute; top:-6px; right:-6px; background:var(--coral); color:white; border:none; border-radius:50%; width:22px; height:22px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.3); z-index:2;">✕</button>
        `;
        card.querySelector('img').onclick = () => openPhotoPreview(src);
        gallery.appendChild(card);
      });

      selectedReceiptFiles.forEach((file, idx) => {
        const objectUrl = URL.createObjectURL(file);
        const card = document.createElement('div');
        card.className = 'receipt-thumb';
        card.innerHTML = `
          <img src="${objectUrl}" alt="Receipt preview" style="width:100%; height:100%; object-fit:cover; border-radius:11px; cursor:pointer;">
          <button type="button" onclick="event.stopPropagation(); removeSelectedReceipt(${idx});" style="position:absolute; top:-6px; right:-6px; background:var(--coral); color:white; border:none; border-radius:50%; width:22px; height:22px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.3); z-index:2;">✕</button>
        `;
        card.querySelector('img').onclick = () => openPhotoPreview(objectUrl);
        gallery.appendChild(card);
      });
    }

    function openPhotoPreview(rawUrl) {
      const modal = document.getElementById('photo-preview-modal');
      const image = document.getElementById('photo-preview-image');
      if (!modal || !image || !rawUrl) return;
      const formattedUrl = typeof formatPhotoUrl === 'function' ? formatPhotoUrl(rawUrl) : rawUrl;
      image.src = formattedUrl;
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closePhotoPreview() {
      const modal = document.getElementById('photo-preview-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    window.openPhotoPreview = openPhotoPreview;
    window.closePhotoPreview = closePhotoPreview;
    window.removeExistingReceipt = removeExistingReceipt;
    window.removeSelectedReceipt = removeSelectedReceipt;

    function renderPayerSelect() {
      const sel = document.getElementById('paidby-select');
      if (!sel) return;
      sel.innerHTML = '';

      if (!members || members.length === 0) {
        sel.innerHTML = '<div class="text-muted p-2" style="font-size:0.8rem;">No members found in trip</div>';
        return;
      }

      if (!selectedPayer || !members.some(m => m.id === selectedPayer)) {
        selectedPayer = members[0].id;
      }

      members.forEach(m => {
        const chip = document.createElement('div');
        const isSelected = m.id === selectedPayer;
        chip.className = `paidby-chip ${isSelected ? 'active' : ''}`;
        chip.textContent = m.displayName || (m.email ? m.email.split('@')[0] : 'Member');
        chip.onclick = () => {
          selectedPayer = m.id;
          renderPayerSelect();
        };
        sel.appendChild(chip);
      });
    }

    function updateCustomSplitBalance() {
      const amount = parseAmount(document.getElementById('amount-input').value);
      const currency = tripData?.currency || 'MYR';
      let currentTotal = 0;

      document.querySelectorAll('[data-custom-split]').forEach(input => {
        currentTotal += parseAmount(input.value);
      });

      currentTotal = Math.round(currentTotal * 100) / 100;
      const remaining = Math.round((amount - currentTotal) * 100) / 100;
      const counterCard = document.getElementById('custom-balance-counter');
      if (!counterCard) return;

      if (Math.abs(remaining) < 0.005) {
        counterCard.style.background = 'rgba(34, 197, 94, 0.12)';
        counterCard.style.borderColor = 'rgba(34, 197, 94, 0.3)';
        counterCard.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; color:#22C55E; font-size:0.85rem;">✓ ${escapeHtml(i18n.t('fullyAllocated') || 'Fully allocated')}</span>
            <span style="font-weight:700; color:var(--text-1); font-size:0.85rem;">${currency} ${currentTotal.toFixed(2)} / ${amount.toFixed(2)}</span>
          </div>
        `;
      } else if (remaining > 0) {
        counterCard.style.background = 'var(--coral-a)';
        counterCard.style.borderColor = 'var(--coral)';
        counterCard.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:600; color:var(--coral); font-size:0.85rem;">${escapeHtml(i18n.t('remainingToAllocate') || 'Remaining to allocate')}:</span>
            <span style="font-weight:800; color:var(--coral); font-size:0.95rem;">${currency} ${remaining.toFixed(2)}</span>
          </div>
          <div style="font-size:0.75rem; color:var(--text-3); margin-top:2px;">${escapeHtml(i18n.t('allocatedTotal') || 'Allocated')}: ${currency} ${currentTotal.toFixed(2)} / ${amount.toFixed(2)}</div>
        `;
      } else {
        const over = Math.abs(remaining);
        counterCard.style.background = 'rgba(239, 68, 68, 0.12)';
        counterCard.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        counterCard.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:600; color:#EF4444; font-size:0.85rem;">⚠️ ${escapeHtml(i18n.t('overAllocated') || 'Over allocated by')}:</span>
            <span style="font-weight:800; color:#EF4444; font-size:0.95rem;">${currency} ${over.toFixed(2)}</span>
          </div>
          <div style="font-size:0.75rem; color:var(--text-3); margin-top:2px;">${escapeHtml(i18n.t('allocatedTotal') || 'Allocated')}: ${currency} ${currentTotal.toFixed(2)} / ${amount.toFixed(2)}</div>
        `;
      }
    }

    function renderSplitDetails() {
      const details = document.getElementById('split-details');
      if (!details) return;
      details.innerHTML = '';

      if (!members || members.length === 0) {
        details.innerHTML = `<div class="text-center p-3 text-muted" style="font-size:0.85rem;">Loading members...</div>`;
        return;
      }

      const amount = parseAmount(document.getElementById('amount-input').value);
      const currency = tripData?.currency || 'MYR';
      const count = members.length || 1;
      
      if (splitType === 'equal') {
        const exactShare = amount / count;
        const floorShare = Math.floor(exactShare * 100) / 100;
        const ceilShare = Math.ceil(exactShare * 100) / 100;
        
        let roundingSelectorHtml = '';
        if (floorShare !== ceilShare && count > 0) {
          roundingSelectorHtml = `
            <div class="rounding-container" style="margin-bottom: 12px; background: var(--bg-hover); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); width: 100%;">
              <label style="font-size: 0.72rem; color: var(--text-3); font-weight: 700; display: block; margin-bottom: 8px; letter-spacing: 0.5px;">ROUNDING PREFERENCE</label>
              <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                <button type="button" class="btn round-opt-btn ${equalRoundMode === 'exact' ? 'btn-primary' : 'btn-secondary'}" data-round="exact" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid var(--border); height: auto;">
                  <span>Exact Split</span>
                  <span style="opacity: 0.85; font-size: 0.78rem;">adds up to ${currency} ${amount.toFixed(2)}</span>
                </button>
                <button type="button" class="btn round-opt-btn ${equalRoundMode === 'down' ? 'btn-primary' : 'btn-secondary'}" data-round="down" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid var(--border); height: auto;">
                  <span>Round Down</span>
                  <span style="opacity: 0.85; font-size: 0.78rem;">${currency} ${floorShare.toFixed(2)} each (Total: ${(floorShare * count).toFixed(2)})</span>
                </button>
                <button type="button" class="btn round-opt-btn ${equalRoundMode === 'up' ? 'btn-primary' : 'btn-secondary'}" data-round="up" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid var(--border); height: auto;">
                  <span>Round Up</span>
                  <span style="opacity: 0.85; font-size: 0.78rem;">${currency} ${ceilShare.toFixed(2)} each (Total: ${(ceilShare * count).toFixed(2)})</span>
                </button>
              </div>
            </div>
          `;
        }
        
        const perPerson = (amount / count).toFixed(2);
        const text = i18n.t('splitEquallyAmongText', { count, currency, perPerson });
        details.innerHTML = `
          ${roundingSelectorHtml}
          <div class="text-center p-3 text-muted" style="font-size:0.85rem; background:var(--bg-hover); border-radius:10px; border:1px solid var(--border); width: 100%;">${text}</div>
        `;
        
        // Add event listeners to equal round buttons
        details.querySelectorAll('.round-opt-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            equalRoundMode = e.currentTarget.dataset.round;
            renderSplitDetails();
          });
        });
      } else if (splitType === 'custom') {
        const counterCard = document.createElement('div');
        counterCard.id = 'custom-balance-counter';
        counterCard.style.padding = '10px 12px';
        counterCard.style.marginBottom = '10px';
        counterCard.style.borderRadius = '10px';
        counterCard.style.border = '1.5px solid var(--coral)';
        counterCard.style.background = 'var(--coral-a)';
        counterCard.style.transition = 'all 0.2s ease';
        details.appendChild(counterCard);

        members.forEach(m => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.justifyContent = 'space-between';
          row.style.alignItems = 'center';
          row.style.padding = '8px 12px';
          row.style.margin = '0 0 8px 0';
          row.style.background = 'var(--bg-hover)';
          row.style.borderRadius = '10px';
          row.style.border = '1px solid var(--border)';
          const existingVal = (loadedExpenseSplits && loadedExpenseSplits[m.id] !== undefined) ? loadedExpenseSplits[m.id] : '';
          row.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="avatar avatar-xs" style="background:${avatarColor(m.id)}">${escapeHtml(getInitials(m.displayName))}</div>
              <span style="font-weight:600; font-size:0.88rem; color:var(--text-1);">${escapeHtml(m.displayName)}</span>
            </div>
            <div style="display:flex; align-items:center; gap:4px;">
              <span style="font-size:0.8rem; color:var(--text-3);">${currency}</span>
              <input type="number" class="form-input custom-split-input" style="width:100px; padding:6px 10px; font-size:0.85rem; font-weight:600; text-align:right;" placeholder="0.00" step="0.01" data-custom-split="${m.id}" value="${existingVal}" />
            </div>
          `;
          details.appendChild(row);
        });

        document.querySelectorAll('[data-custom-split]').forEach(input => {
          input.addEventListener('input', updateCustomSplitBalance);
        });

        updateCustomSplitBalance();
      } else if (splitType === 'selective') {
        const selected = [];
        members.forEach(m => {
          const isChecked = (loadedExpenseSplits) ? (loadedExpenseSplits[m.id] !== undefined) : true;
          if (isChecked) selected.push(m.id);
        });
        const selCount = selected.length || 1;
        const exactShare = amount / selCount;
        const floorShare = Math.floor(exactShare * 100) / 100;
        const ceilShare = Math.ceil(exactShare * 100) / 100;

        let roundingSelectorHtml = '';
        if (floorShare !== ceilShare && selected.length > 0) {
          roundingSelectorHtml = `
            <div class="rounding-container" style="margin-bottom: 12px; background: var(--bg-hover); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); width: 100%;">
              <label style="font-size: 0.72rem; color: var(--text-3); font-weight: 700; display: block; margin-bottom: 8px; letter-spacing: 0.5px;">ROUNDING PREFERENCE</label>
              <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                <button type="button" class="btn round-opt-btn ${equalRoundMode === 'exact' ? 'btn-primary' : 'btn-secondary'}" data-round="exact" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid var(--border); height: auto;">
                  <span>Exact Split</span>
                  <span style="opacity: 0.85; font-size: 0.78rem;">adds up to ${currency} ${amount.toFixed(2)}</span>
                </button>
                <button type="button" class="btn round-opt-btn ${equalRoundMode === 'down' ? 'btn-primary' : 'btn-secondary'}" data-round="down" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid var(--border); height: auto;">
                  <span>Round Down</span>
                  <span style="opacity: 0.85; font-size: 0.78rem;">${currency} ${floorShare.toFixed(2)} each (Total: ${(floorShare * selCount).toFixed(2)})</span>
                </button>
                <button type="button" class="btn round-opt-btn ${equalRoundMode === 'up' ? 'btn-primary' : 'btn-secondary'}" data-round="up" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid var(--border); height: auto;">
                  <span>Round Up</span>
                  <span style="opacity: 0.85; font-size: 0.78rem;">${currency} ${ceilShare.toFixed(2)} each (Total: ${(ceilShare * selCount).toFixed(2)})</span>
                </button>
              </div>
            </div>
          `;
        }

        const container = document.createElement('div');
        container.style.width = '100%';
        container.innerHTML = roundingSelectorHtml;
        details.appendChild(container);

        members.forEach(m => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.justifyContent = 'space-between';
          row.style.alignItems = 'center';
          row.style.padding = '8px 12px';
          row.style.margin = '0 0 8px 0';
          row.style.background = 'var(--bg-hover)';
          row.style.borderRadius = '10px';
          row.style.border = '1px solid var(--border)';
          const isChecked = (loadedExpenseSplits) ? (loadedExpenseSplits[m.id] !== undefined) : true;
          row.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="avatar avatar-xs" style="background:${avatarColor(m.id)}">${escapeHtml(getInitials(m.displayName))}</div>
              <span style="font-weight:600; font-size:0.88rem; color:var(--text-1);">${escapeHtml(m.displayName)}</span>
            </div>
            <input type="checkbox" ${isChecked ? 'checked' : ''} data-sel-split="${m.id}" style="width:20px; height:20px; accent-color:var(--coral); cursor:pointer;"/>
          `;
          details.appendChild(row);
        });

        // Add event listeners to selective round buttons
        details.querySelectorAll('.round-opt-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            equalRoundMode = e.currentTarget.dataset.round;
            renderSplitDetails();
          });
        });

        // Add event listener to selective checkboxes
        details.querySelectorAll('[data-sel-split]').forEach(cb => {
          cb.addEventListener('change', () => {
            if (!loadedExpenseSplits) {
              loadedExpenseSplits = {};
              members.forEach(m => {
                loadedExpenseSplits[m.id] = amount / members.length;
              });
            }
            if (cb.checked) {
              loadedExpenseSplits[cb.dataset.selSplit] = amount / (details.querySelectorAll('[data-sel-split]:checked').length || 1);
            } else {
              delete loadedExpenseSplits[cb.dataset.selSplit];
            }
            renderSplitDetails();
          });
        });
      }
    }

    async function handleSave(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      if (!saveBtn || saveBtn.disabled) return;

      const amount = parseAmount(document.getElementById('amount-input').value);
      if (!amount || amount <= 0) return showToast('Enter a valid amount');
      
      const title = document.getElementById('title-input').value.trim();
      const date = document.getElementById('date-input').value;
      const notes = document.getElementById('notes-input').value.trim();
      
      // Compute splits
      let splits = {};
      let calculationAmount = amount;

      if (splitType === 'equal') {
        if (equalRoundMode === 'exact') {
          splits = computeEqualSplits(amount, members.map(m => m.id));
        } else if (equalRoundMode === 'down') {
          const share = Math.floor((amount / members.length) * 100) / 100;
          members.forEach(m => splits[m.id] = share);
          calculationAmount = Math.round(share * members.length * 100) / 100;
        } else if (equalRoundMode === 'up') {
          const share = Math.ceil((amount / members.length) * 100) / 100;
          members.forEach(m => splits[m.id] = share);
          calculationAmount = Math.round(share * members.length * 100) / 100;
        }
      } else if (splitType === 'custom') {
        let total = 0;
        document.querySelectorAll('[data-custom-split]').forEach(input => {
          const val = parseFloat(input.value) || 0;
          const roundedVal = Math.round(val * 100) / 100;
          splits[input.dataset.customSplit] = roundedVal;
          total += roundedVal;
        });
        total = Math.round(total * 100) / 100;
        if (Math.abs(total - amount) > 0.005) {
          return showToast(i18n.t('errSplitTotal') || 'Split amounts must add up to the total.');
        }
      } else if (splitType === 'selective') {
        const selected = Array.from(document.querySelectorAll('[data-sel-split]:checked')).map(cb => cb.dataset.selSplit);
        if (selected.length === 0) return showToast('Select at least one person');
        
        if (equalRoundMode === 'exact') {
          splits = computeSelectiveSplits(amount, selected);
        } else if (equalRoundMode === 'down') {
          const share = Math.floor((amount / selected.length) * 100) / 100;
          selected.forEach(id => splits[id] = share);
          calculationAmount = Math.round(share * selected.length * 100) / 100;
        } else if (equalRoundMode === 'up') {
          const share = Math.ceil((amount / selected.length) * 100) / 100;
          selected.forEach(id => splits[id] = share);
          calculationAmount = Math.round(share * selected.length * 100) / 100;
        }
      }

      const originalBtnText = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = selectedReceiptFiles.length ? 'Processing photos...' : 'Saving...';

      let newPhotoUrls = [];
      if (selectedReceiptFiles.length) {
        try {
          const promises = selectedReceiptFiles.map(file => typeof fileToDataUrl === 'function' ? fileToDataUrl(file) : null);
          const results = await Promise.all(promises);
          newPhotoUrls = results.filter(url => url !== null);
        } catch (photoErr) {
          console.warn('Error processing receipt photos:', photoErr);
        }
      }

      const allPhotoUrls = [...existingReceiptUrls, ...newPhotoUrls];

      const expenseData = {
        title,
        amount,
        calculationAmount: calculationAmount !== undefined ? calculationAmount : amount,
        equalRoundMode: (splitType === 'equal' || splitType === 'selective') ? equalRoundMode : null,
        date,
        category: selectedCategory,
        paidBy: selectedPayer,
        addedBy: currentUser ? currentUser.uid : selectedPayer,
        notes,
        splits,
        photoUrls: allPhotoUrls,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (expenseId) {
          await db.collection('trips').doc(tripId).collection('expenses').doc(expenseId).update(expenseData);
        } else {
          expenseData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('trips').doc(tripId).collection('expenses').add(expenseData);
        }

        showToast(expenseId ? 'Expense updated' : 'Expense added');
        goBack();
      } catch (err) {
        console.error('Error saving expense:', err);
        saveBtn.disabled = false;
        saveBtn.textContent = originalBtnText;
        const message = err && err.message ? err.message : '';
        if (message.includes('permission') || message.includes('Permission')) {
          showToast('Saving failed due to access rules. Please contact the trip admin.');
        } else {
          showToast('Error saving expense: ' + (message || 'Please try again.'));
        }
      }
    }

    async function deleteExpense() {
      if (confirm('Delete this expense?')) {
        await db.collection('trips').doc(tripId).collection('expenses').doc(expenseId).delete();
        showToast('Expense deleted');
        goBack();
      }
    }

    function goBack() {
      window.location.href = `trip.html?id=${tripId}`;
    }
  </script>
