<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripTab - Forgot Password</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
</head>
<body class="auth-page">
    <div class="auth-hero">
        <div class="auth-hero-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="6" width="20" height="14" rx="3" fill="white" fill-opacity="0.9"/>
                <rect x="2" y="6" width="20" height="6" rx="3" fill="white" fill-opacity="0.4"/>
                <path d="M12 4L14.5 8.5H9.5L12 4Z" fill="white" fill-opacity="0.9"/>
                <circle cx="7" cy="15" r="1.5" fill="rgba(255,107,107,0.6)"/>
            </svg>
            <h1>TripTab</h1>
        </div>
    </div>
    <div class="auth-card">
        <a href="login.html" class="back-link">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        </a>
        <h2 data-i18n="resetTitle">Reset Password</h2>
        <div id="error-message" class="error-text hidden"></div>
        <div id="success-message" class="success-text hidden" data-i18n="resetSuccess">
            If an account exists, a reset link has been sent.
        </div>
        <form id="forgot-form">
            <div class="form-group">
                <label for="email" data-i18n="emailLabel">Email</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full mt-4" id="submit-btn">
                <span data-i18n="sendResetBtn">Send Reset Link</span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorMsg = document.getElementById('error-message');
            const successMsg = document.getElementById('success-message');
            const submitBtn = document.getElementById('submit-btn');
            const form = document.getElementById('forgot-form');
            
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-small"></span>';

            try {
                await firebase.auth().sendPasswordResetEmail(email);
                form.classList.add('hidden');
                successMsg.classList.remove('hidden');
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span data-i18n="sendResetBtn">Send Reset Link</span>';
            }
        });
    </script>
</body>
</html>
